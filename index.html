<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>numUber.tv</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --violet-texte: #3b1c6b;
      --violet-header: #c4a5f5;
      --violet-onglet: #d9c4fa;
      --violet-clair: #efe5ff;
      --fond: #fbf8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Lato', Arial, sans-serif;
      background: var(--fond);
      color: #2e1d4a;
      line-height: 1.75;
      font-size: 1.05rem;
    }

    /* Les boutons radio qui commandent les onglets (invisibles) */
    input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }

    header {
      background: var(--violet-header);
      text-align: center;
      padding: 2.2rem 1rem 0;
    }
    header h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.8rem;
      color: var(--violet-texte);
      letter-spacing: 1px;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: .5rem;
      margin-top: 1.6rem;
    }
    nav label {
      background: var(--violet-onglet);
      color: var(--violet-texte);
      padding: .8rem 1.8rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px 10px 0 0;
      transition: background .2s;
    }
    nav label:hover { background: #e6d6fc; }

    /* Onglet actif */
    #tab-projet:checked ~ header label[for="tab-projet"],
    #tab-enquete:checked ~ header label[for="tab-enquete"] {
      background: var(--fond);
    }

    main { max-width: 800px; margin: 2.2rem auto; padding: 0 1.2rem; }
    section { display: none; }
    #tab-projet:checked ~ main #projet { display: block; }
    #tab-enquete:checked ~ main #enquete { display: block; }

    h2 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--violet-texte);
      font-size: 1.9rem;
      border-bottom: 3px solid var(--violet-header);
      padding-bottom: .4rem;
    }
    .video {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      border: 4px solid var(--violet-header);
      background: var(--violet-clair);
    }
    .video iframe, .video video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    footer {
      text-align: center;
      color: #8a63c7;
      padding: 2rem 1rem;
      font-size: .9rem;
    }
  </style>
</head>
<body>

  <input type="radio" name="onglet" id="tab-projet" checked>
  <input type="radio" name="onglet" id="tab-enquete">

  <header>
    <h1>numUber.tv</h1>
    <nav>
      <label for="tab-projet">Notre projet</label>
      <label for="tab-enquete">Notre enquête</label>
    </nav>
  </header>

  <main>
    <!-- ONGLET 1 : NOTRE PROJET (vidéo) -->
    <section id="projet">
      <h2>Notre projet</h2>
      <p>Présentation de notre projet en vidéo :</p>

      <div class="video">
        <!-- Remplace VIDEO_ID par l'identifiant de ta vidéo YouTube -->
        <iframe src="https://www.youtube.com/embed/VIDEO_ID" title="Vidéo numUber.tv" allowfullscreen></iframe>
      </div>
    </section>

    <!-- ONGLET 2 : NOTRE ENQUÊTE (texte) -->
    <section id="enquete">
      <h2>Notre enquête</h2>
      <p>Écris ici le premier paragraphe de ton texte.</p>
      <p>Ici le deuxième paragraphe. Tu peux en ajouter autant que tu veux en copiant une ligne comme celle-ci.</p>

      <h2>Un sous-titre</h2>
      <p>Et la suite de ton enquête.</p>
    </section>
  </main>

  <footer>© numUber.tv</footer>

</body>
</html>
