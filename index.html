<html lang="fr">

      --fond: #faf7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: var(--fond);
      color: #2a1a3d;
      line-height: 1.7;
    }
    header {
      background: var(--mauve-fonce);
      color: white;
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    header h1 { margin: 0; font-size: 2.4rem; letter-spacing: 1px; }
    nav {

      justify-content: center;
      gap: .5rem;
      margin-top: 1.5rem;
    }
    nav button {
      background: var(--mauve);
      color: white;
      border: none;
      padding: .8rem 1.6rem;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
    }
    nav button:hover { background: #8f62c4; }
    nav button.actif { background: var(--fond); color: var(--mauve-fonce); font-weight: bold; }
    main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    section { display: none; }
    section.actif { display: block; }
    h2 { color: var(--mauve-fonce); border-bottom: 3px solid var(--mauve-clair); padding-bottom: .4rem; }
    .video {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      border: 4px solid var(--mauve-clair);
    }
    .video iframe, .video video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    footer { text-align: center; color: var(--mauve); padding: 2rem 1rem; font-size: .9rem; }
  </style>
</head>

    </section>
  </main>

  <footer>© numUber.tv</footer>
